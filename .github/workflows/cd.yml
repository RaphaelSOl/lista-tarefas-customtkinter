name: CD - Build do aplicativo

on:
  push:
    branches:
      - main
      - desenvolvimento

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Gerar executável Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller --onefile --windowed --name ListaDeTarefas lista_tarefas_customtkinter.py

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: ListaDeTarefas-Windows
          path: dist/ListaDeTarefas.exe