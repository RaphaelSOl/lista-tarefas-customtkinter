name: CI - Python

on:
  push:
    branches:
      - main
      - desenvolvimento

  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Validar aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe do Python
        run: |
          python -m py_compile lista_tarefas_customtkinter.py

      - name: Verificar importação do CustomTkinter
        run: |
          python -c "import customtkinter; print('CustomTkinter instalado com sucesso')"